<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="companion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>companion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    function companionSpeakText(text, languageCode, preference) {
      if (!window.speechSynthesis) {
        alert("Speech output is not supported on this browser.");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = languageCode;
      utterance.rate = 0.92;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();

      if (voices && voices.length > 0) {
        const languageVoices = voices.filter(v =>
          v.lang && v.lang.toLowerCase().startsWith(languageCode.toLowerCase().split("-")[0])
        );

        let selectedVoice = null;

        if (preference === "female") {
          selectedVoice = languageVoices.find(v =>
            v.name.toLowerCase().includes("female") ||
            v.name.toLowerCase().includes("woman") ||
            v.name.toLowerCase().includes("samantha") ||
            v.name.toLowerCase().includes("zira")
          );
        }

        if (preference === "male") {
          selectedVoice = languageVoices.find(v =>
            v.name.toLowerCase().includes("male") ||
            v.name.toLowerCase().includes("man") ||
            v.name.toLowerCase().includes("david")
          );
        }

        utterance.voice =
          selectedVoice ||
          languageVoices[0] ||
          voices[0];
      }

      window.speechSynthesis.speak(utterance);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
